name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --- 任务 1：创建 Release 草稿 ---
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create Release
        id: create-release
        uses: actions/github-script@v6
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-build' }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG_NAME,
              name: `LocalType ${process.env.TAG_NAME}`,
              body: 'Release assets for LocalType',
              draft: true,
              prerelease: false
            })
            return data.id

  # --- 任务 2：构建桌面端 (Tauri) ---
  build-desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'windows-latest'
            args: '--target i686-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin') || (matrix.args == '--target i686-pc-windows-msvc' && 'i686-pc-windows-msvc') || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: install frontend dependencies
        run: |
          cd localtype_desktop
          npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: localtype_desktop
          args: ${{ matrix.args }}
          releaseAssetNamePattern: 'LocalType-[version]-[platform]-[arch][setup][ext]'

  # --- 任务 3：构建移动端 (Flutter/Android) ---
  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: install dependencies
        run: |
          cd localtype_flutter
          flutter pub get

      - name: decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > localtype_flutter/android/app/upload-keystore.jks

      - name: build APK
        run: |
          cd localtype_flutter
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: build App Bundle
        run: |
          cd localtype_flutter
          flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          cd localtype_flutter/build/app/outputs/flutter-apk/
          for f in app-*-release.apk; do
            mv "$f" "${f//app/LocalType}"
          done

      - name: Up Android to Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-build' }}
          files: |
            localtype_flutter/build/app/outputs/flutter-apk/LocalType-*.apk
            localtype_flutter/build/app/outputs/bundle/release/*.aab
          draft: true
