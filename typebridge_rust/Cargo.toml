[package]
name = "localtype_rust"
version = "1.2.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
local-ip-address = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
rand = "0.8"
directories = "5.0"
enigo = "0.3.0"
arboard = "3.3"
native-dialog = "0.9"
tokio-rustls = "0.24"
rustls-pemfile = "1.0"
rcgen = "0.11"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tray-icon = "0.14"
tao = "0.28"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[build-dependencies]
# No slint-build needed for this version
